fcns:
  penalties:
    default:
      # static l1 weight w; dual is off unless a config turns on dual.autotune
      penalty:       trajopt/methods/common/penalties.py:penalty_cost_proxlin
      autotune:      null
      create_params: trajopt/methods/common/penalties.py:create_params_proxlin
      update_params: trajopt/methods/common/penalties.py:update_params_proxlin
      # merit is configured in trust_region/scalar.yaml, not here

hyperparams:
  penalties:
    default:
      w: 1000.0
      dual:
        autotune: False
        init: 0.0
      vb: standard
      eps: [0.0001]
