fcns:
  penalties:
    default:
      penalty:       trajopt/methods/common/penalties.py:penalty_cost_std
      autotune:      trajopt/methods/common/penalties.py:autotune_std
      create_params: trajopt/methods/common/penalties.py:create_params_std
      update_params: trajopt/methods/common/penalties.py:update_params_std

hyperparams:
  penalties:
    default:
      W:
        penalty: True
        autotune: True
        init: 1.0
      dual:
        penalty: True
        autotune: True
        init: 0.0
        tr_step: 1.0
      vb: standard
      eps: [0.0001]
      # only read by sqp_autotune (penalties.py's EXPERIMENTAL AUTOTUNING EXTENSIONS)
      experimental:
        freeze_iters: 100.0
        rho_stall: 0.05
        dual_step: 0.1
        split:
          eps_scale: 0.9
          clip: [0.0001, 1.0e+8]
        standard:
          eps_scale: 0.01
          damp_scale: 0.9
          clip: [0.00001, 1.0e+7]
