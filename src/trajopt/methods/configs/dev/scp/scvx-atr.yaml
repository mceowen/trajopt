inherit:
  - trajopt/methods/configs/stable/scp/scvx.yaml
  - trajopt/methods/common/configs/initial_guess/straight_line.yaml
  - trajopt/methods/common/configs/trust_region/adaptive.yaml

fcns:
  trust_region:
    merit:
      default:
        compile: trajopt/methods/common/trust_region.py:compile_merit_proxlin
        eval:    trajopt/methods/common/trust_region.py:evaluate_merit_proxlin
        grad:    trajopt/methods/common/trust_region.py:merit_value_and_grad_alpha_proxlin

# no merit violation entry for these types (scalar.yaml); make them hard instead.
hyperparams:
  penalties:
    initial_state:
      vb: none
    initial_control:
      vb: none
    initial_time:
      vb: none
    final_time:
      vb: none
