inherit:
  - trajopt/methods/dev/configs/first_order/scvx-rev1.yaml
  - trajopt/methods/common/configs/trust_region/second_order.yaml
  - trajopt/methods/common/configs/convexify/second_order.yaml
  - trajopt/methods/common/configs/discretize/second_order_ms.yaml

hyperparams:
  discretize:
    nsub: 3
  trust_region:
    lm_adapt:     0
    line_search:  1
    alpha_min_ls: 1.0e-7   # smallest line-search step
    min_eig_psd:  1.0e-6   # eigenvalue floor for the trust-region Hessian square root
  penalties:
    default:
      dual:
        autotune: True

fcns:
  penalties:
    default:
      penalty:       trajopt/methods/common/penalties.py:penalty_cost_sqp
      create_params: trajopt/methods/common/penalties.py:create_params_sqp
      update_params: trajopt/methods/common/penalties.py:update_params_sqp
