num_nodes: 40
inherit: model.yaml

params:
  g: 9.81
  mp: 0.3
  mc: 1
  l: 0.5

constraints:
  dynamics:
    type: dynamics
    fcn: fcns.dynamics

  initial_state:
    type: initial_state
    value: [0, 0, 0, 0]

  final_state:
    type: final_state
    value: [1, "${np.pi}", 0, 0]

  initial_time:
    type: initial_time
    value: 0.0

  final_time:
    type: final_time
    value: 2.0

  state_limits:
    type: state_limits
    lower: [-4, null, null, null]
    upper: [ 4, null, null, null]

  control_limits:
    type: control_limits
    lower: [-20]
    upper: [20]

costs:
  u_squared:
    type: nonconvex_running
    fcn: fcns.u_squared_cost
    w: 1.0


