# Minimum-control-effort double-integrator unicycle with two circular no-fly zones (thesis ch2 benchmark).
num_nodes: 30
inherit: model.yaml

params:
  obstacles: [[3.0, 4.0, 1.5], [7.0, 6.5, 1.5]]   # [x, y, radius]

constraints:
  dynamics: {type: dynamics, fcn: fcns.dynamics, eps: {default: 0.001}}
  initial_state: {type: initial_state, value: [0.0, 0.0, 0.0, "${np.deg2rad(45)}", 0.0]}
  final_state: {type: final_state, value: [10.0, 10.0, 0.0, null, 0.0], eps: 0.001}
  state_limits: {type: state_limits, lower: [-2, -2, 0.0, -6.3, -1.0], upper: [12, 12, 3.0, 6.3, 1.0]}
  control_limits: {type: control_limits, lower: [-2.0, "${-np.deg2rad(10)}"], upper: [2.0, "${np.deg2rad(10)}"]}
  control_rate_limit: {type: control_rate_limit, value: [3.0, "${np.deg2rad(5)}"]}
  obstacle: {type: nonconvex_inequality, fcn: fcns.obstacle, lower: [1.5, 1.5], eps: 0.001}
  final_time: {type: final_time, value: 10.0}

costs:
  control_effort: {type: regularization, set: control, idx: [0, 1], norm_type: l2, w: 1.0}
