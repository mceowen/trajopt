inherit: mission/problem.yaml

constraints:
  max_heat_rate:
    type: nonconvex_inequality
    fcn: fcns.heat_rate
    upper: [5.5]
    scale: 1.0

state.r.scale: 100000.0
state.theta.scale: 90.0
state.phi.scale: 90.0
state.v.scale: 10000.0
state.gamma.scale: 10.0
state.psi.scale: 90.0
control.bank.scale: 180.0
control.aoa.scale: 30.0
time.scale: 1000.0

costs:
  max_crossrange:
    w: -90.0
  control_smoothness:
    type: rate_regularization
    set: control
    idx: [0, 1]
    norm_type: l2
    w: 2.0
