flow:
  stages:
    - name: p
      allow_nonconverged: true
      config: stages/p.yaml
    - name: ms
      config: stages/ms.yaml
      initial_guess: {from: p, endpoint_weights: true}
    - name: hp
      config: stages/hp.yaml
      initial_guess: {from: ms, endpoint_weights: true}
      # Patterson--Hager--Rao p-then-h, doi:10.1002/oca.2114, Eqs. 34--35.
      refinement:
        tolerance: 1.0e-6
        min_degree: 3
        max_degree: 10
        max_meshes: 8
        max_nodes: 1500
