# Fixed-time minimum-control-effort transfer of a 3-DoF quadrotor around a cylindrical no-fly zone: the benchmark of the
# AutoSCvx chapter of the dissertation (minimum thrust and the no-fly zone are the nonconvex path constraints).
num_nodes: 20
inherit: trajopt/models/quadrotor_3dof/quadrotor_3dof.yaml

fcns:
  thrust_norm:      trajopt/models/quadrotor_3dof/quadrotor_3dof.py:thrust_norm
  obstacle:         trajopt/models/quadrotor_3dof/quadrotor_3dof.py:obstacle
  max_thrust_cone:  trajopt/models/quadrotor_3dof/quadrotor_3dof.py:max_thrust_cone
  xz:               trajopt/models/quadrotor_3dof/quadrotor_3dof.py:xz
  yz:               trajopt/models/quadrotor_3dof/quadrotor_3dof.py:yz

params:
  planet:
    inherit: trajopt/models/common/planets/earth.yaml
  vehicle:
    inherit: quadrotor.yaml
  obstacle:
    radius: 4.0

constraints:
  dynamics:
    type: dynamics
    fcn: fcns.dynamics
    eps:
      default: 0.001

  initial_state:
    type: initial_state
    value: [0.0, 0.0, 5.0, 0.0, 0.5, 0.0]

  final_state:
    type: final_state
    value: [10.0, 10.0, 0.5, 0.0, 0.0, 0.0]
    eps: 0.01

  max_thrust:
    type: convex_inequality
    fcn: fcns.max_thrust_cone

  min_thrust:
    type: nonconvex_inequality
    fcn: fcns.thrust_norm
    lower: "${params.vehicle.T_min}"

  obstacle:
    type: nonconvex_inequality
    fcn: fcns.obstacle
    pos: [5.5, 4.5]   # x, y (extends infinitely in z)
    lower: "${params.obstacle.radius}"
    scale: "${[params.obstacle.radius]}"
    eps: 0.0004

  final_time:
    type: final_time
    value: 7.0

costs:
  control_effort:
    type: regularization
    set: control
    idx: [0, 1, 2]
    norm_type: l2
    w: 1.0
