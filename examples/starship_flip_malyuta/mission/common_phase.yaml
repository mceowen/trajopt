# ===============================
# INHERIT MODEL CONFIGS
# ===============================
inherit: model.yaml

# ===============================
# PARAMETERS
# ===============================
params:
  inherit: starship.yaml

# ===============================
# CONSTRAINTS
# ===============================
constraints:
  dynamics:
    type: dynamics
    fcn: fcns.dynamics

  state_limits:
    type: state_limits
    lower: [null, 0,    null, null, "${np.deg2rad(-45.0)}", null]
    upper: [null, null, null, null,  "${np.deg2rad(90.0)}", null]

  control_limits:
    type: control_limits
    lower: [880000, "${np.deg2rad(-10)}"]
    upper: [6000000, "${np.deg2rad(10)}"]

  glide_slope:
    type: convex_inequality
    fcn: fcns.cvx_glide_slope

# ===============================
# COSTS
# ===============================
costs:
  # min_time:
  #   type: min_time

  u_squared:
    type: nonconvex_running
    fcn: fcns.u_squared_cost
    scale: 1000000000000
    w: 1