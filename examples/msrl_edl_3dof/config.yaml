# MSRL multiphase EDL: guided entry, parachute descent, powered descent

trajectory:
  segments:

    # guided entry: guidance initiation to parachute deployment
    entry:
      num_nodes: 100
      inherit: trajopt/examples/experiments/msrl/msrl_common_segment.yaml

      fcns:
        nonlinear_aero: trajopt/missions/msrl.py:nonlinear_aero
        deploy_position_error_sq: trajopt/missions/msrl.py:deploy_position_error_sq

      params:
        deploy_target:
          lon: 77.275
          lat: 18.406

        # lift polynomial coefficients
        a_l: 0.679945
        b_l: -9.522473
        c_l: 59.179219
        d_l: -215.423516
        e_l: 510.853276
        f_l: -830.748818
        g_l: 950.127376
        h_l: -771.365024
        i_l: 443.191605
        j_l: -177.601759
        k_l: 48.232018
        l_l: -8.362472
        m_l: 1.177526

        # drag polynomial coefficients
        a_d: 1.458554
        b_d: -20.501723
        c_d: 128.239298
        d_d: -470.835046
        e_d: 1126.686522
        f_d: -1844.173832
        g_d: 2106.728736
        h_d: -1681.164677
        i_d: 921.349863
        j_d: -333.513962
        k_d: 74.164741
        l_d: -8.758177
        m_d: 1.684456

      constraints:
        initial_state:
          type: initial_state
          value: [3456160, 68.20, 14.12, 7935.15, -7.7075, 62.2803]

        # pre-bank attitude held into guidance initiation
        initial_control:
          type: initial_control
          value: [120, null]

        # bank commanded to zero as the deploy sequence begins
        final_control:
          type: final_control
          value: [0, null]

        # deployment box: M 0.7 to 2.0, q 700 to 900 Pa
        deploy_mach:
          type: final_state_limits
          lower: [null, null, null, "${0.7 * params.planet.a_sound}", null, null]
          upper: [null, null, null, "${2.0 * params.planet.a_sound}", null, null]

        deploy_dynamic_pressure:
          type: final_nonconvex_inequality
          fcn: fcns.dynamic_pressure
          lower: 0.7
          upper: 0.9
          scale: [0.9]

        # 6 km of descent above separation
        deploy_altitude:
          type: final_state_limits
          lower: ["${params.target.r_sep + 6000.0}", null, null, null, null, null]

        bank_aoa_angle_limits:
          type: control_limits
          lower: [-360.0, null]
          upper: [360.0, null]

        # bank rate and acceleration limits
        bank_angle_rate_limit:
          type: control_rate_limit
          value: [13]
          idx: [0]

        bank_angle_accel_limit:
          type: control_accel_limit
          value: [5]
          idx: [0]

        # 13 g against a 15 g structural limit
        max_load:
          type: nonconvex_inequality
          fcn: fcns.aero_load
          upper: 13.0
          scale: [13.0]

        # inactive: peaks are about 102 W/cm^2 and 27 kPa
        # max_heat_rate:
        #   type: nonconvex_inequality
        #   fcn: fcns.heat_rate
        #   upper: 165.0
        #   scale: [165.0]
        #
        # max_dynamic_pressure:
        #   type: nonconvex_inequality
        #   fcn: fcns.dynamic_pressure
        #   upper: 35.0
        #   scale: [35.0]

      outputs:
        aero_load:
          upper_limit: 13.0

        guidance_off_vel:
          type: event
          component: v
          before_end: 6.0
          group: state
          units: m/s
          title: "Guidance-off Velocity"
          xlabel: "Time (s)"
          ylabel: "Velocity (m/s)"

      costs:
        bank_rate_smoothness:
          type: rate_regularization
          set: control
          idx: [0]
          norm_type: l2
          w: 0.001

      # J1, squared error to a prescribed deploy point:
      #
      #   deploy_targeting:
      #     type: nonconvex_terminal
      #     fcn: fcns.deploy_position_error_sq
      #     scale: 1000000.0

      # the guessed boundaries match the ones the next segments declare
      guess:
        t_start: 0.0
        t_stop: 215.0
        u_start: [120.0, 0.0]
        u_stop: [0, 0.0]

    descent:
      num_nodes: 40
      inherit: trajopt/examples/experiments/msrl/msrl_common_segment.yaml

      fcns:
        nonlinear_aero: trajopt/missions/msrl.py:parachute_aero

      constraints:
        state_continuity:
          type: state_continuity
          segment: entry

        time_continuity:
          type: time_continuity
          segment: entry

        final_state:
          type: final_state
          value: ["${params.target.r_sep}", null, null, null, null, null]

        # ends below the mean radius
        state_limits:
          type: state_limits
          lower: ["${params.target.r_sep - 2000.0}", null, null, 100.0, null, null]

        # no bank authority under the parachute
        no_control_authority:
          type: control_limits
          lower: [0.0, 0.0]
          upper: [0.0, 0.0]

      costs:
        # J2, squared miss distance at touchdown
        touchdown_targeting:
          type: nonconvex_terminal
          fcn: fcns.target_miss_distance_sq
          scale: 1000000.0

      guess:
        t_start: 215.0
        t_stop: 270.0
        x_start: previous          # deploy state the entry guess propagates to
        u_start: [0.0, 0.0]
        u_stop: [0.0, 0.0]

    # powered descent: backshell separation to the terminal descent handoff
    pdg:
      num_nodes: 30
      inherit: trajopt/examples/experiments/msrl/msrl_common_segment.yaml

      fcns:
        nonlinear_aero: trajopt/missions/msrl.py:lander_aero
        dynamics: trajopt/missions/msrl.py:powered_descent_dynamics
        thrust_accel_mag: trajopt/missions/msrl.py:thrust_accel_mag
        thrust_accel_sq: trajopt/missions/msrl.py:thrust_accel_sq
        max_thrust_accel_cone: trajopt/missions/msrl.py:max_thrust_accel_cone

      # thrust acceleration in the velocity frame, appended after bank and aoa
      control.aT_v:
        idx: [2]
        scale: 10.0
      control.aT_n:
        idx: [3]
        scale: 10.0
      control.aT_s:
        idx: [4]
        scale: 10.0

      params:
        # ground radius at the site, placeholder until MSRL data arrives
        target:
          r_td: 3392950.0

      constraints:
        state_continuity:
          type: state_continuity
          segment: descent

        time_continuity:
          type: time_continuity
          segment: descent

        # hand off to terminal descent 50 m above the site
        final_state:
          type: final_state
          value: ["${params.target.r_td + 50.0}", "${params.target.lon}", "${params.target.lat}", null, null, null]

        # near-vertical handoff
        final_state_limits:
          type: final_state_limits
          lower: [null, null, null, 18.0, -88.0, null]
          upper: [null, null, null, 22.0, -60.0, null]

        # 15 m/s velocity floor
        state_limits:
          lower: ["${params.target.r_td}", null, null, 15.0, -88.0, null]

        # bank and aoa pinned, thrust boxed by the accel ceiling
        control_limits:
          type: control_limits
          lower: [0.0, 0.0, "${-params.vehicle.aT_max}", "${-params.vehicle.aT_max}", "${-params.vehicle.aT_max}"]
          upper: [0.0, 0.0, "${params.vehicle.aT_max}", "${params.vehicle.aT_max}", "${params.vehicle.aT_max}"]

        max_thrust:
          type: convex_inequality
          fcn: fcns.max_thrust_accel_cone

      costs:
        fuel:
          type: nonconvex_running
          fcn: fcns.thrust_accel_sq
          scale: 10000.0
          w: 0.1

      outputs:
        thrust_accel:
          type: time_series
          fcn: fcns.thrust_accel_mag
          group: control
          title: "Thrust Acceleration vs Time"
          xlabel: "Time (s)"
          ylabel: "Thrust Acceleration (m/s²)"

      guess:
        t_start: 270.0
        t_stop: 295.0
        x_start: previous          # separation state the chute guess falls to
        u_start: [0.0, 0.0, -7.0, 0.0, 0.0]
        u_stop: [0.0, 0.0, -7.0, 0.0, 0.0]

method:
  inherit: trajopt/methods/dev/scvx/configs/autoscvx-term.yaml

  flags:
    equal_dt: 1
    zoh_dilation: 1
    # nondimensional step gate, wider on gamma and psi
    eps_state: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-2, 1.0e-2]
    iter_max: 1000

  penalty:
    default:
      fac_target: 0.001

    tr_step:
      z:
        default: 2.0
      nu:
        default: 1.0

    # only buffered constraints read eps
    final_state:
      eps: [1.0e-4]
    nonconvex_inequality:
      eps: [1.0e-4]

  # the thrust magnitude bound is a cone
  solver_opts:
    solver: CLARABEL

analysis:
  type: standalone
  compute_iters: false
  show_iters: false
  show_convergence: true
  show_weights: false
