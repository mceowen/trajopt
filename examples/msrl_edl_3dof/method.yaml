inherit: trajopt/methods/dev/scp_phases/configs/scvx/autoscvx-term.yaml

hyperparams:
  flags:
    zoh_dilation: 1
  discretize:
    equal_dt: 1

  convergence:
    iter_max: 1000
    # nondimensional step gate, wider on gamma and psi
    eps_state: [1.0e-4, 1.0e-4, 1.0e-4, 1.0e-4, 1.0e-2, 1.0e-2]

  penalties:
    default:
      fac_target: 0.001

    # only buffered constraints read eps
    final_state:
      eps: [1.0e-4]
    nonconvex_inequality:
      eps: [1.0e-4]

  trust_region:
    tr_step:
      z:
        default: 2.0
      nu:
        default: 1.0

  initial_guess:
    entry:
      t_start: 0.0
      t_stop: 215.0
      u_start: [120.0, 0.0]
      u_stop: [0, 0.0]
    descent:
      t_start: 215.0
      t_stop: 270.0
      x_start: previous          # deploy state the entry guess propagates to
      u_start: [0.0, 0.0]
      u_stop: [0.0, 0.0]
    pdg:
      t_start: 270.0
      t_stop: 295.0
      x_start: previous          # separation state the chute guess falls to
      u_start: [0.0, 0.0, -7.0, 0.0, 0.0]
      u_stop: [0.0, 0.0, -7.0, 0.0, 0.0]

# the thrust magnitude bound is a cone
solver_opts:
  solver: CLARABEL

