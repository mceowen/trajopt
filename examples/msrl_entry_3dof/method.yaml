inherit: trajopt/methods/dev/scp_phases/configs/scvx/autoscvx-term.yaml

hyperparams:
  flags:
    zoh_dilation: 1
  discretize:
    equal_dt: 1

  convergence:
    iter_max: 400
    # nondimensional step gate, wider on gamma and psi
    eps_state: [3.0e-3, 3.0e-3, 3.0e-3, 3.0e-3, 3.0e-2, 3.0e-2]

  penalties:
    default:
      fac_target: 0.001

    # only buffered constraints read eps
    final_state:
      eps: [1.0e-4]

  trust_region:
    tr_step:
      z:
        default: 10.0
      nu:
        default: 2.0

  initial_guess:
    default:
      t_start: 0.0
      t_stop: 100.0
      u_start: [120.0, 0.0]
      u_stop: [0, 0.0]

solver_opts:
  solver: CLARABEL
